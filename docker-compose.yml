services:
  postgres:
    image: postgres:17-alpine
    container_name: retailops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: retailops
      POSTGRES_USER: retailops
      POSTGRES_PASSWORD: retailops
    ports:
      - "5432:5432"
    volumes:
      - retailops_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retailops -d retailops"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  retailops_pgdata:
